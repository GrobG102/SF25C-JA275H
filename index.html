<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>フライトログ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    body { font-family: sans-serif; font-size: 22px; padding: 15px; background-color: #f9f9f9; color: #333; margin: 0; }
    h2 { font-size: 24px; border-bottom: 3px solid #00B900; padding-bottom: 5px; margin-top: 10px; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 20px; color: #555; }
    input, select, button, textarea { font-size: 22px; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; background-color: #fff; transition: background-color 0.3s; }
    
    .required::after { content: " *"; color: #ef5350; font-weight: bold; font-size: 20px; }
    .sub-label { font-size: 14px; color: #777; font-weight: normal; }
    .empty-required { background-color: #ffebee !important; border: 2px solid #ef5350 !important; }
    
    .flex-row { display: flex; align-items: center; gap: 10px; width: 100%; }
    .flex-row > * { margin-bottom: 0; margin-top: 0; }
    .half-input { flex-grow: 1; width: 40%; min-width: 0; }
    .icon-btn { font-size: 28px; padding: 10px; flex-shrink: 0; width: auto; background: #e0e0e0; border: none; cursor: pointer; }
    
    .label-with-btn { display: flex; justify-content: space-between; align-items: baseline; }
    .lcl-btn { font-size: 16px; padding: 6px 12px; width: auto; background-color: #2196F3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .wt-container { display: flex; align-items: center; gap: 15px; }
    .wt-btn { font-size: 24px; width: 60px; background-color: #ddd; border: none; }
    .wt-display { font-size: 24px; font-weight: bold; width: 50px; text-align: center; }
    
    .highlight-box { background-color: #e8f5e9; border: 2px solid #4caf50; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: bold; }
    .btn-submit { background-color: #00B900; color: white; border: none; font-weight: bold; margin-top: 30px; }
    .btn-submit:disabled { background-color: #9e9e9e; cursor: not-allowed; }
    
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
    .btn-blue { background-color: #2196F3; color: white; border: none; font-weight: bold; margin-top: 20px; }
    .hidden { display: none !important; }
    
    .date-warning-box { background-color: #ffebee; border: 2px solid #ef5350; color: #c62828; padding: 10px; border-radius: 8px; margin-top: 5px; font-size: 16px; font-weight: bold; text-align: center;}
    .date-alert-bg { background-color: #ffebee !important; border: 2px solid #ef5350 !important; }

    .contact-container { background-color: #eceff1; border: 1px solid #b0bec5; padding: 15px; border-radius: 12px; margin-top: 40px; }
    .contact-title { font-size: 18px; font-weight: bold; color: #37474f; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .btn-contact-send { background-color: #607d8b; color: white; border: none; font-weight: bold; margin-top: 10px; font-size: 18px; padding: 8px; }
  </style>
</head>
<body>

  <div id="loading-view" style="text-align: center; padding-top: 50px;">
    <h2>システム起動中</h2>
    <p style="font-size: 18px; color: #666;">そのまましばらくお待ちください...</p>
    <div id="loading-status" style="display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 18px; border: 1px solid #a5d6a7;">
      準備中...
    </div>
  </div>

  <div id="login-view" class="card hidden">
    <h2>ブラウザ版 ログイン</h2>
    <label class="required">本名（スペースなし）</label>
    <input type="text" id="login-name" class="req-check" placeholder="例：山田太郎">
    <label class="required">共通パスワード</label>
    <input type="password" id="login-pass" class="req-check">
    <button type="button" id="login-btn" class="btn-blue">ログインする</button>
  </div>

  <div id="request-view" class="card hidden">
    <h2>クラブ利用申請</h2>
    <label class="required">本名（スペースなし）</label>
    <input type="text" id="req-name" class="req-check" placeholder="例：山田太郎">
    <label class="required">搭乗者区分</label>
    <select id="req-category" class="req-check"><option value="">選択してください</option></select>
    <button type="button" id="req-btn" class="btn-submit">利用申請をする</button>
  </div>

  <div id="pending-view" class="card hidden" style="text-align: center;">
    <h2 style="border-bottom: 3px solid #ff9800;">利用申請中</h2>
    <p>管理者の承認待ちです。</p>
  </div>

  <div id="main-form-view" class="hidden">
    <h2>フライトログ入力</h2>
    <p id="user-welcome" style="font-size: 16px; color: #00B900; font-weight: bold; text-align: right; margin: 0;"></p>
    
    <label class="required">飛行日</label>
    <input type="date" id="flight-date" class="req-check">
    <div id="date-alert-box" class="date-warning-box hidden"></div>

    <div style="margin-top: 15px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ccc; display: flex; align-items: center; gap: 10px;">
      <input type="checkbox" id="solo-flight-chk" style="width: 30px; height: 30px; margin: 0;">
      <label for="solo-flight-chk" style="margin: 0; font-size: 22px; cursor: pointer;">単独飛行（右席なし）</label>
    </div>

    <label class="required">左席 / 右席</label>
    <div class="flex-row">
      <input list="member-list" id="left-seat" class="half-input seat-check" placeholder="左席" autocomplete="name">
      <button type="button" id="swap-btn" class="icon-btn">🔄</button>
      <input list="member-list" id="right-seat" class="half-input seat-check" placeholder="右席" autocomplete="name">
    </div>

    <label class="required">飛行目的</label>
    <input list="purpose-list" id="purpose" class="req-check" placeholder="名前を入力または選択">
    <datalist id="purpose-list"></datalist>

    <div class="label-with-btn">
      <label class="required">出発地 / 到着地</label>
      <button type="button" id="lcl-btn" class="lcl-btn">LCL (同地)</button>
    </div>
    <div class="flex-row">
      <input list="place-list" id="departure" class="half-input req-check" placeholder="出発地">
      <span style="font-weight:bold;">→</span>
      <input list="place-list" id="arrival" class="half-input req-check" placeholder="到着地">
    </div>
    <datalist id="place-list"></datalist>

    <label class="required">発進時刻 / 停止時刻</label>
    <div class="flex-row">
      <input type="time" id="start-time" class="half-input req-check">
      <span style="font-weight:bold;">〜</span>
      <input type="time" id="stop-time" class="half-input req-check">
    </div>

    <div class="highlight-box">飛行時間： <span id="flight-time-display">0時間0分</span></div>

    <label class="required">WT回数</label>
    <div class="wt-container">
      <button type="button" id="wt-minus" class="wt-btn">－</button>
      <div id="wt-display" class="wt-display">0</div>
      <button type="button" id="wt-plus" class="wt-btn" style="background-color: #ff9800; color: white;">＋</button>
    </div>

    <label class="required">機長名 (PIC)</label><input list="member-list" id="pic" class="req-check" placeholder="名前を入力">
    <label class="required">振込予定者</label><input list="member-list" id="payer" class="req-check" placeholder="名前を入力">
    <label class="required">搭乗者区分</label><select id="payer-category" class="req-check"><option value="">選択してください</option></select>
    
    <label>備考</label><input type="text" id="memo" placeholder="特記事項">
    
    <label class="required">フライト料金（円）</label>
    <input type="number" id="amount-input" class="req-check" placeholder="金額" style="font-weight: bold; color: #e65100; border: 2px solid #ff9800;">

    <button type="button" id="submit-btn" class="btn-submit">ログを送信する</button>
  </div>
  <datalist id="member-list"></datalist>

  <div id="contact-box" class="contact-container">
    <div id="contact-toggle" class="contact-title">
      <span id="contact-title-text">✉ 管理者へ連絡・不具合報告</span>
      <span id="contact-arrow">▼</span>
    </div>
    <div id="contact-body">
      <p id="contact-target-text" style="font-size: 14px; color: #555; margin: 5px 0; font-weight: bold;"></p>
      <textarea id="contact-msg" rows="3" placeholder="修正依頼など（3行程度）" style="font-size:18px; width:100%; padding:10px; border-radius:6px; resize:none;"></textarea>
      <button type="button" id="contact-btn" class="btn-contact-send">メッセージを送信する</button>
    </div>
  </div>

  <script>
    // ▼▼▼ 【設定】URLとIDを貼り付けてください ▼▼▼
    const GAS_URL = "ここにGASのURL";
    const LIFF_ID = "ここにLIFF_ID";
    // ▲▲▲ 【設定】ここまで ▲▲▲

    let wtCount = 0, priceMaster = {}, memberCategoryMap = {}, totalMinutes = 0, flightTimeString = "0:00"; 
    let loginUserName = "", loginUserCategory = "", lineProfile = { userId: "", displayName: "" };
    let isContactOpen = false; let dateStatus = "valid"; let dateDiffText = "";

    function updateStatus(text) {
      console.log("状態更新:", text);
      document.getElementById('loading-status').innerText = text;
    }

    async function callGas(action, extraParams = {}) {
      console.log("📡 GAS通信:", action);
      const payload = { action: action, ...extraParams };
      const response = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
      if (!response.ok) throw new Error("GAS通信エラー: " + response.status);
      return await response.json();
    }

    function updateValidationColors() {
      document.querySelectorAll('.req-check').forEach(el => {
        if (!el.value) el.classList.add('empty-required'); else el.classList.remove('empty-required');
      });
      const left = document.getElementById('left-seat'), right = document.getElementById('right-seat');
      if (document.getElementById('solo-flight-chk').checked) {
        right.classList.remove('empty-required');
        if (!left.value) left.classList.add('empty-required'); else left.classList.remove('empty-required');
      } else {
        if (!left.value && !right.value) { left.classList.add('empty-required'); right.classList.add('empty-required'); } 
        else { left.classList.remove('empty-required'); right.classList.remove('empty-required'); }
      }
    }

    function showView(viewId, foldContact = false) {
      document.querySelectorAll('.card, #main-form-view, #loading-view').forEach(el => el.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
      const body = document.getElementById('contact-body'), arrow = document.getElementById('contact-arrow'), titleText = document.getElementById('contact-title-text'), targetText = document.getElementById('contact-target-text');
      if (viewId === 'request-view') { titleText.innerText = "✉ 管理者に問い合わせる"; targetText.classList.add('hidden'); } 
      else { titleText.innerText = "✉ 管理者へ連絡・不具合報告"; targetText.classList.remove('hidden'); }
      if (foldContact) { body.classList.add('hidden'); arrow.innerText = "▼"; isContactOpen = false; } 
      else { body.classList.remove('hidden'); arrow.innerText = "▲"; isContactOpen = true; }
    }

    // ★ 画面の準備（イベントリスナー登録など） ★
    function setupFormEvents() {
      const now = new Date();
      document.getElementById('flight-date').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      
      const sanitizeSpace = function(e) { this.value = this.value.replace(/[\s　]/g, ''); };
      document.getElementById('login-name').addEventListener('input', sanitizeSpace);
      document.getElementById('req-name').addEventListener('input', sanitizeSpace);

      document.getElementById('solo-flight-chk').addEventListener('change', (e) => {
        const rightSeat = document.getElementById('right-seat');
        if (e.target.checked) { rightSeat.value = ""; rightSeat.disabled = true; rightSeat.placeholder = "（単独飛行）"; } 
        else { rightSeat.disabled = false; rightSeat.placeholder = "右席"; }
        updateValidationColors();
      });

      document.getElementById('flight-date').addEventListener('change', function() {
        const alertBox = document.getElementById('date-alert-box');
        if (!this.value) { alertBox.classList.add('hidden'); this.classList.remove('date-alert-bg'); dateStatus = "valid"; return; }
        const sel = new Date(this.value + "T00:00:00"), today = new Date();
        today.setHours(0,0,0,0); sel.setHours(0,0,0,0);
        const diffDays = Math.ceil((sel - today) / (1000 * 60 * 60 * 24));

        if (diffDays > 0) {
          dateStatus = "future"; this.classList.add('date-alert-bg');
          alertBox.innerText = "⚠️ 未来の日付です。ご確認ください。"; alertBox.classList.remove('hidden');
        } else if (diffDays < 0) {
          dateStatus = "past"; this.classList.add('date-alert-bg');
          const abs = Math.abs(diffDays);
          dateDiffText = (abs >= 365) ? `${Math.floor(abs/365)}年${Math.floor((abs%365)/30)}ヶ月${(abs%365)%30}日前` : (abs >= 30) ? `${Math.floor(abs/30)}ヶ月${abs%30}日前` : `${abs}日前`;
          alertBox.innerText = `💡 ${dateDiffText} の飛行ログですね？`; alertBox.classList.remove('hidden');
        } else {
          dateStatus = "valid"; this.classList.remove('date-alert-bg'); alertBox.classList.add('hidden');
        }
      });

      document.body.addEventListener('input', (e) => { if (e.target.classList.contains('req-check') || e.target.classList.contains('seat-check')) updateValidationColors(); });

      document.getElementById('contact-toggle').addEventListener('click', () => {
        if (document.getElementById('main-form-view').classList.contains('hidden') && !document.getElementById('loading-view').classList.contains('hidden')) return; 
        const body = document.getElementById('contact-body'), arrow = document.getElementById('contact-arrow');
        if (isContactOpen) { body.classList.add('hidden'); arrow.innerText = "▼"; isContactOpen = false; } 
        else { body.classList.remove('hidden'); arrow.innerText = "▲"; isContactOpen = true; }
      });

      document.getElementById('swap-btn').addEventListener('click', () => {
        if (document.getElementById('solo-flight-chk').checked) return; 
        const l = document.getElementById('left-seat'), r = document.getElementById('right-seat'), t = l.value; l.value = r.value; r.value = t; updateValidationColors();
      });

      document.getElementById('lcl-btn').addEventListener('click', () => { const dep = document.getElementById('departure').value; if (dep) { document.getElementById('arrival').value = dep; updateValidationColors(); } });

      const calcPrice = () => {
        const c = document.getElementById('payer-category').value, a = document.getElementById('amount-input');
        if (c && priceMaster[c] && totalMinutes > 0) a.value = priceMaster[c] * totalMinutes; else if (totalMinutes === 0) a.value = "";
        updateValidationColors();
      };

      document.getElementById('payer').addEventListener('input', (e) => { if (memberCategoryMap[e.target.value]) document.getElementById('payer-category').value = memberCategoryMap[e.target.value]; calcPrice(); });
      document.getElementById('payer-category').addEventListener('change', calcPrice);

      const calcTime = () => {
        const s = document.getElementById('start-time').value, st = document.getElementById('stop-time').value;
        if(s && st) {
          const start = new Date(`1970-01-01T${s}:00`), stop = new Date(`1970-01-01T${st}:00`);
          if(stop < start) stop.setDate(stop.getDate() + 1);
          totalMinutes = Math.floor((stop - start) / 60000);
          document.getElementById('flight-time-display').innerText = `${Math.floor(totalMinutes / 60)}時間${totalMinutes % 60}分`;
          flightTimeString = `${Math.floor(totalMinutes / 60)}:${(totalMinutes % 60).toString().padStart(2, '0')}`;
          calcPrice();
        }
      };
      document.getElementById('start-time').addEventListener('change', calcTime); document.getElementById('stop-time').addEventListener('change', calcTime);

      document.getElementById('wt-plus').addEventListener('click', () => { wtCount++; document.getElementById('wt-display').innerText = wtCount; });
      document.getElementById('wt-minus').addEventListener('click', () => { if(wtCount > 0) wtCount--; document.getElementById('wt-display').innerText = wtCount; });

      // ボタン送信処理群
      document.getElementById('login-btn').addEventListener('click', async () => {
        const name = document.getElementById('login-name').value, pass = document.getElementById('login-pass').value;
        if(!name || !pass) { updateValidationColors(); return alert("入力してください。"); }
        const btn = document.getElementById('login-btn'); btn.disabled = true; btn.innerText = "確認中..."; 
        try {
          const res = await callGas('loginWithPassword', { name: name, password: pass });
          if(res.success) { loginUserName = res.name; loginUserCategory = res.category; await loadMainForm(); } 
          else { alert(res.error); btn.disabled = false; btn.innerText = "ログインする"; }
        } catch(e) { alert("通信エラー"); btn.disabled = false; btn.innerText = "ログインする"; }
      });

      document.getElementById('req-btn').addEventListener('click', async () => {
        const name = document.getElementById('req-name').value, cat = document.getElementById('req-category').value;
        if(!name || !cat) { updateValidationColors(); return alert("入力してください。"); }
        const btn = document.getElementById('req-btn'); btn.disabled = true; btn.innerText = "申請中...";
        try {
          const res = await callGas('submitApplication', { data: { name: name, category: cat, lineName: lineProfile.displayName, lineUserId: lineProfile.userId } });
          if(res.success) { showView('pending-view', false); } else { alert(res.error); btn.disabled = false; btn.innerText = "利用申請をする"; }
        } catch(e) { alert("エラーが発生しました"); btn.disabled = false; btn.innerText = "利用申請をする"; }
      });

      document.getElementById('contact-btn').addEventListener('click', async () => {
        const msg = document.getElementById('contact-msg').value.trim();
        if (!msg) return alert("メッセージを入力してください。");
        const btn = document.getElementById('contact-btn'); btn.disabled = true; btn.innerText = "送信中...";
        try {
          const res = await callGas('sendContactMessage', { data: { senderName: loginUserName || lineProfile.displayName || "未登録", message: msg } });
          if (res.success) { alert("送信しました！"); document.getElementById('contact-msg').value = ""; } else { alert("エラー: " + res.error); }
          btn.disabled = false; btn.innerText = "メッセージを送信する";
        } catch(e) { alert("エラーが発生しました"); btn.disabled = false; btn.innerText = "メッセージを送信する"; }
      });

      document.getElementById('submit-btn').addEventListener('click', async () => {
        if (dateStatus === "future") return alert("未来の日付です！！送信ブロック。");
        if (dateStatus === "past") { if (!confirm(`※確認：${dateDiffText} の飛行ログですね？`)) return; }

        const rawDate = document.getElementById('flight-date').value; let y = "", m = "";
        if (rawDate) { const p = rawDate.split("-"); y = p[0]; m = `${parseInt(p[1], 10)}/${parseInt(p[2], 10)}`; }
        const isSolo = document.getElementById('solo-flight-chk').checked;
        const formData = {
          year: y, monthDay: m, leftSeat: document.getElementById('left-seat').value, rightSeat: isSolo ? "-" : document.getElementById('right-seat').value,
          purpose: document.getElementById('purpose').value, departure: document.getElementById('departure').value, arrival: document.getElementById('arrival').value,
          startTime: document.getElementById('start-time').value, stopTime: document.getElementById('stop-time').value, timeString: flightTimeString, 
          wtCount: wtCount, pic: document.getElementById('pic').value, payer: document.getElementById('payer').value,
          category: docum
